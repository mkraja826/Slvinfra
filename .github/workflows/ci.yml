name: Build, typecheck and static site smoke test
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Verify five exported pages and essential assets
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const pages = ['','about','services','projects','contact'];
          for (const route of pages) {
            const file = path.join('out',route,'index.html');
            if (!fs.existsSync(file)) throw new Error('Missing exported route: '+file);
            const html = fs.readFileSync(file,'utf8');
            if (!html.includes('SLV') || !html.includes('<main')) throw new Error('Invalid page content: '+file);
            console.log('PASS',route || 'home');
          }
          const cssDir = 'out/_next/static/css';
          if (!fs.existsSync(cssDir) || !fs.readdirSync(cssDir).some(x=>x.endsWith('.css'))) throw new Error('Missing compiled CSS assets');
          const projectHtml=fs.readFileSync('out/projects/index.html','utf8');
          if (!projectHtml.includes('Search by client or project')) throw new Error('Projects search missing');
          const cssFiles = new Set(fs.readdirSync(cssDir).filter(x => x.endsWith('.css')));
          for (const route of pages) {
            const html = fs.readFileSync(path.join('out',route,'index.html'),'utf8');
            const links = [...html.matchAll(/<link\\b[^>]*rel=["']stylesheet["'][^>]*>/gi)].map(m => m[0]);
            const hrefs = links.map(tag => tag.match(/href=["']([^"']+)["']/i)?.[1]).filter(Boolean);
            if (!hrefs.length) throw new Error('No stylesheet linked from '+(route||'home'));
            for (const href of hrefs) {
              const assetPath = path.join('out',decodeURIComponent(href.split('?')[0]).replace(/^\\//,''));
              if (!fs.existsSync(assetPath)) throw new Error('Broken stylesheet link '+href+' on '+(route||'home'));
            }
          }
          console.log('All five routes, linked stylesheets and static assets verified');
          NODE

  deploy:
    name: Deploy static assets to Cloudflare Workers
    needs: verify
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check deployment credentials
        id: credentials
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare deploy skipped: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions secrets."
          fi
      - uses: actions/checkout@v4
        if: steps.credentials.outputs.available == 'true'
      - uses: actions/setup-node@v4
        if: steps.credentials.outputs.available == 'true'
        with:
          node-version: '22'
      - name: Build deployable site
        if: steps.credentials.outputs.available == 'true'
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Publish Worker static assets
        if: steps.credentials.outputs.available == 'true'
        run: npx wrangler deploy
